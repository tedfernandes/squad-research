<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 528" width="700" height="528" role="img" aria-label="Numeros do substrato de verificacao do squad-harness">
  <title>squad-harness: numeros do substrato de verificacao</title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
