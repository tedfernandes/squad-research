  <rect x="2" y="2" width="696" height="524" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="28" y="40" class="h">Numeros do substrato de verificacao</text>
  <text x="28" y="60" class="sub">squad-harness · dados reais no commit medido, nada fabricado</text>
  <line x1="28" y1="76" x2="672" y2="76" stroke="#d8dee4" stroke-width="1"/>

  <text x="28" y="100" class="pt">Terceiro estado · projetos avaliados</text>
  <rect x="28" y="112" width="22" height="22" rx="5" fill="#40c463"/>
