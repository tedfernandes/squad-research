  <text x="272" y="130" class="lg">com suite de teste · 11</text>
  <rect x="252" y="142" width="14" height="14" rx="4" fill="#ebedf0" stroke="#d0d7de"/>
  <text x="272" y="154" class="lg">sem nenhum teste · 10</text>
  <text x="28" y="212" class="lg">10 de 21 projetos (48%) sem nenhum teste. Num runner de 2 estados seriam "verde";</text>
  <text x="28" y="228" class="lg">aqui viram INDETERMINADO e nao dao merge automatico.</text>
