  <line x1="28" y1="366" x2="672" y2="366" stroke="#d8dee4" stroke-width="1"/>

  <text x="28" y="390" class="pt">Cobertura de avaliacao · reportada com honestidade</text>
  <text x="28" y="410" class="lg">casos-golden definidos</text>
  <rect x="28" y="416" width="520" height="20" rx="4" fill="#2da44e"/>
  <text x="556" y="431" class="numg">37</text>
  <text x="28" y="458" class="lg">casos efetivamente pontuados</text>
  <rect x="28" y="464" width="17" height="20" rx="4" fill="#2da44e"/>
  <text x="52" y="479" class="numg">17</text>
  <text x="28" y="508" class="lg">o harness e os &#8805;30 casos existem e sao impostos; 17 foram pontuados em 4 agentes no commit medido.</text>
